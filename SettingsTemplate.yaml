body:
  - type: input
    attributes:
      name: input_cur
      label: "Default input currency:"
      defaultValue: "USD"
      description: "Default source currency. An ISO 4217 code (USD, EUR, TRY) or one of your own aliases."
  - type: input
    attributes:
      name: output_cur
      label: "Default output currency:"
      defaultValue: "USD EUR JPY"
      description: "Default output currencies, separated by spaces or commas. Codes and your own aliases both work."
  - type: input
    attributes:
      name: app_id
      label: "OpenExchangeRates App ID:"
      defaultValue: ""
      description: "OpenExchangeRates App ID (used if cache fails)"
  - type: dropdown
    attributes:
      name: update_freq
      label: "Update Frequency:"
      defaultValue: "daily"
      options:
        - never
        - hourly
        - daily
      description: "Update frequency (auto-refresh rates)"
  - type: input
    attributes:
      name: separators
      label: "Separator:"
      defaultValue: "to in : ."
      description: "Source⇄destination separators (whitespace-separated)"
  - type: input
    attributes:
      name: destination_separators
      label: "Destination Separator:"
      defaultValue: "and & ,"
      description: "Destination currency separators (whitespace-separated)"
  - type: textarea
    attributes:
      name: aliases
      label: "Aliases:"
      defaultValue: "USD = $ dollar dollars bucks\nEUR = euro euros"
      description: "One 'CODE = alias alias ...' per line, separated by spaces or commas. Symbols work too, e.g. 'TRY = ₺ lira tl' or 'RUB = ₽ ruble'."
